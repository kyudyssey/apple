<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f0e7">
  <title>사과게임 | 합이 10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f1f0e7;
      --ink: #20241e;
      --muted: #777b6d;
      --line: #d9dacd;
      --apple: #d83e2e;
      --leaf: #557d3a;
      --tile: #fbfaf4;
      --tile-shadow: #d7d8ca;
      --mono: "DM Mono", "Courier New", monospace;
      --display: "Space Grotesk", "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#c9cbbc 0.65px, transparent 0.65px);
      background-size: 13px 13px;
      font-family: var(--display);
    }

    button { font: inherit; }

    .shell {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
      padding: 30px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      width: 38px;
      aspect-ratio: 1;
      place-items: center;
      color: #fff8e9;
      background: var(--apple);
      border-radius: 13px 13px 15px 15px;
      font-size: 21px;
      line-height: 1;
      transform: rotate(-5deg);
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: 0; }
    .brand-note { margin-top: 2px; color: var(--muted); font: 10px var(--mono); letter-spacing: 0; }

    .restart {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      color: var(--ink);
      background: transparent;
      border: 1px solid #bfc2b3;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background-color 150ms ease, border-color 150ms ease;
    }
    .restart:hover { background: #e4e5d9; border-color: #8e9380; }
    .restart:focus-visible { outline: 3px solid #9daf74; outline-offset: 2px; }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 276px;
      align-items: start;
      gap: clamp(24px, 5vw, 68px);
      padding-top: 37px;
    }

    .game-area { width: min(100%, 596px); margin: 0 auto; }
    .game-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 16px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); line-height: 1; letter-spacing: 0; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .goal-tag {
      padding: 7px 10px;
      color: #fff8e9;
      background: var(--leaf);
      border-radius: 4px;
      font: 11px var(--mono);
      white-space: nowrap;
    }

    .board-frame {
      position: relative;
      padding: clamp(8px, 2vw, 13px);
      overflow: hidden;
      background: #dfe0d1;
      border: 1px solid #c8cabb;
      border-radius: 8px;
      box-shadow: 0 4px 0 #c9cabc, 0 12px 28px #43493612;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: clamp(4px, 1vw, 7px);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .cell {
      display: grid;
      min-width: 0;
      aspect-ratio: 1;
      place-items: center;
      color: #30352b;
      background: var(--tile);
      border: 1px solid #fdfcf7;
      border-radius: 4px;
      box-shadow: 0 2px 0 var(--tile-shadow);
      cursor: crosshair;
      font: 600 clamp(15px, 3.4vw, 25px)/1 var(--display);
      transition: background-color 100ms ease, color 100ms ease, transform 100ms ease, box-shadow 100ms ease;
    }
    .cell:nth-child(7n + 2), .cell:nth-child(11n + 4) { color: #8c4538; }
    .cell.selected {
      z-index: 1;
      color: #fffdf4;
      background: var(--apple);
      border-color: #c32e20;
      box-shadow: 0 2px 0 #a92c21, 0 0 0 2px #f7c5a9;
      transform: translateY(-1px) scale(1.04);
    }
    .cell.empty {
      background: #cdd0c0;
      border-color: #cdd0c0;
      box-shadow: inset 0 1px 3px #656c5430;
      cursor: default;
    }
    .cell:focus-visible { outline: 3px solid #557d3a; outline-offset: 1px; }

    .board-footer {
      display: flex;
      min-height: 37px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 2px 0;
      color: var(--muted);
      font: 10px var(--mono);
    }
    .sum-readout { color: var(--ink); font-weight: 500; }
    .sum-readout.over { color: var(--apple); }

    .sidebar { padding-top: 3px; }
    .score-label, .stat-label { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; }
    .score-block { padding: 0 0 22px; border-bottom: 1px solid var(--line); }
    .score-value { margin-top: 3px; font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .score-unit { margin-left: 5px; color: var(--muted); font-size: 12px; font-weight: 500; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .stat + .stat { padding-left: 18px; border-left: 1px solid var(--line); }
    .stat-value { margin-top: 5px; font: 22px var(--mono); font-variant-numeric: tabular-nums; }
    .timer-value { color: var(--apple); }
    .timer-track { height: 4px; margin-top: 10px; overflow: hidden; background: #d9dacd; border-radius: 4px; }
    .timer-fill { width: 100%; height: 100%; background: var(--apple); transform-origin: left; transition: transform 250ms linear; }

    .howto { padding: 19px 0; border-bottom: 1px solid var(--line); }
    .howto-title { margin: 0 0 12px; font-size: 13px; }
    .howto-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .howto-list li { display: grid; grid-template-columns: 19px 1fr; gap: 8px; color: #5c6154; font-size: 11px; line-height: 1.5; }
    .step { display: grid; width: 18px; height: 18px; place-items: center; color: var(--leaf); background: #dfe6d3; border-radius: 50%; font: 10px var(--mono); }
    .best-note { padding-top: 15px; color: var(--muted); font-size: 10px; line-height: 1.5; }

    .overlay {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #20241ec9;
      backdrop-filter: blur(3px);
    }
    .overlay[hidden] { display: none; }
    .result {
      width: min(100%, 290px);
      padding: 25px 22px 22px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid #fffdf1;
      border-radius: 7px;
      text-align: center;
      box-shadow: 0 12px 40px #12150f66;
      animation: pop-in 220ms ease-out both;
    }
    .result-mark { color: var(--apple); font-size: 28px; }
    .result h2 { margin: 7px 0 3px; font-size: 23px; }
    .result p { margin: 0; color: var(--muted); font-size: 12px; }
    .result-score { margin: 18px 0; font: 36px var(--mono); }
    .result .restart { width: 100%; color: white; background: var(--ink); border-color: var(--ink); }
    .result .restart:hover { background: #3b4135; }

    @keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    @media (max-width: 720px) {
      .shell { width: min(100% - 28px, 520px); padding-top: 18px; }
      main { grid-template-columns: 1fr; gap: 24px; padding-top: 25px; }
      .game-area { width: 100%; }
      .sidebar { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; padding: 0 2px; }
      .score-block { grid-column: 1 / -1; padding-bottom: 14px; }
      .score-value { font-size: 48px; }
      .stats { padding: 14px 0; }
      .howto { border-bottom: 0; }
      .best-note { grid-column: 1 / -1; padding-top: 0; }
    }
    @media (max-width: 420px) {
      .shell { width: calc(100% - 20px); padding-top: 12px; }
      .topbar { padding-bottom: 13px; }
      .brand-mark { width: 33px; }
      .brand-name { font-size: 15px; }
      .brand-note { font-size: 9px; }
      .restart { min-height: 36px; padding: 0 10px; }
      main { padding-top: 20px; }
      .game-heading { margin-bottom: 11px; }
      .subtitle { font-size: 10px; }
      .goal-tag { padding: 6px 8px; font-size: 10px; }
      .board-frame { padding: 7px; }
      .board { gap: 4px; }
      .board-footer { font-size: 9px; }
      .sidebar { column-gap: 13px; }
      .stat + .stat { padding-left: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="사과게임">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <div>
          <div class="brand-name">사과게임</div>
          <div class="brand-note">NUMBER ORCHARD / 01</div>
        </div>
      </div>
      <button class="restart" id="restart" type="button" title="새 게임 시작">
        <span aria-hidden="true">↻</span> 다시 시작
      </button>
    </header>

    <main>
      <section class="game-area" aria-label="게임 보드">
        <div class="game-heading">
          <div>
            <h1>열 개를 모아라</h1>
            <p class="subtitle">숫자를 이어 합이 10이 되면 수확!</p>
          </div>
          <span class="goal-tag">TARGET : 10</span>
        </div>
        <div class="board-frame">
          <div class="board" id="board" role="grid" aria-label="8 곱하기 8 숫자 격자"></div>
          <div class="overlay" id="overlay" hidden>
            <div class="result" role="dialog" aria-modal="true" aria-labelledby="result-title">
              <div class="result-mark" aria-hidden="true">✳</div>
              <h2 id="result-title">수확 끝!</h2>
              <p>오늘의 사과를 모두 모았어요.</p>
              <div class="result-score"><span id="final-score">0</span><span class="score-unit">점</span></div>
              <button class="restart" id="play-again" type="button">↻ 다시 플레이</button>
            </div>
          </div>
        </div>
        <div class="board-footer">
          <span>DRAG TO CONNECT</span>
          <span class="sum-readout" id="sum-readout" aria-live="polite">선택 합계&nbsp; 0</span>
        </div>
      </section>

      <aside class="sidebar" aria-label="게임 정보">
        <div class="score-block">
          <div class="score-label">CURRENT SCORE</div>
          <div class="score-value"><span id="score">0</span><span class="score-unit">점</span></div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="stat-label">BEST</div>
            <div class="stat-value" id="best-score">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">TIME LEFT</div>
            <div class="stat-value timer-value" id="time-left">2:00</div>
            <div class="timer-track" aria-hidden="true"><div class="timer-fill" id="timer-fill"></div></div>
          </div>
        </div>
        <section class="howto" aria-label="게임 규칙">
          <h2 class="howto-title">수확 방법</h2>
          <ol class="howto-list">
            <li><span class="step">1</span><span>숫자를 누른 채 상하좌우로 이어주세요.</span></li>
            <li><span class="step">2</span><span>합이 10이면 손을 떼서 사과를 수확해요.</span></li>
            <li><span class="step">3</span><span>10을 넘으면 선택이 자동으로 풀려요.</span></li>
          </ol>
        </section>
        <div class="best-note">최고 점수는 이 기기에 자동 저장됩니다.</div>
      </aside>
    </main>
  </div>

  <script>
    (() => {
      const boardElement = document.querySelector('#board');
      const scoreElement = document.querySelector('#score');
      const bestElement = document.querySelector('#best-score');
      const timeElement = document.querySelector('#time-left');
      const timerFill = document.querySelector('#timer-fill');
      const sumReadout = document.querySelector('#sum-readout');
      const overlay = document.querySelector('#overlay');
      const finalScore = document.querySelector('#final-score');
      const gameLength = 120;
      const boardSize = 8;
      const storageKey = 'apple-game-best-score';

      let values = [];
      let selected = [];
      let score = 0;
      let secondsLeft = gameLength;
      let dragging = false;
      let gameOver = false;
      let timerId;

      function readBestScore() {
        try {
          const saved = Number(localStorage.getItem(storageKey));
          return Number.isFinite(saved) && saved > 0 ? saved : 0;
        } catch {
          return 0;
        }
      }

      function createBoard() {
        values = Array.from({ length: boardSize * boardSize }, () => Math.floor(Math.random() * 9) + 1);
        boardElement.replaceChildren();
        values.forEach((value, index) => {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.setAttribute('role', 'gridcell');
          cell.dataset.index = String(index);
          cell.textContent = String(value);
          boardElement.append(cell);
        });
      }

      function updateScore() {
        scoreElement.textContent = String(score);
        const best = Math.max(readBestScore(), score);
        bestElement.textContent = String(best);
        if (score > 0 && best === score) {
          try { localStorage.setItem(storageKey, String(score)); } catch { /* Storage may be unavailable in private browsing. */ }
        }
      }

      function renderSelection() {
        boardElement.querySelectorAll('.selected').forEach(cell => cell.classList.remove('selected'));
        selected.forEach(index => boardElement.children[index]?.classList.add('selected'));
        const total = selected.reduce((sum, index) => sum + values[index], 0);
        sumReadout.innerHTML = `선택 합계&nbsp; ${total}`;
        sumReadout.classList.toggle('over', total > 10);
      }

      function clearSelection() {
        selected = [];
        renderSelection();
      }

      function isAdjacent(first, second) {
        const rowDistance = Math.abs(Math.floor(first / boardSize) - Math.floor(second / boardSize));
        const columnDistance = Math.abs((first % boardSize) - (second % boardSize));
        return rowDistance + columnDistance === 1;
      }

      function visitCell(index) {
        if (!dragging || gameOver || values[index] === 0) return;
        const previousPosition = selected.indexOf(index);
        if (previousPosition !== -1) {
          if (previousPosition === selected.length - 2) {
            selected.pop();
            renderSelection();
          }
          return;
        }
        const previous = selected[selected.length - 1];
        if (previous !== undefined && !isAdjacent(previous, index)) return;
        selected.push(index);
        renderSelection();
        const total = selected.reduce((sum, selectedIndex) => sum + values[selectedIndex], 0);
        if (total > 10) {
          clearSelection();
          dragging = false;
        }
      }

      function finishSelection() {
        if (!dragging) return;
        dragging = false;
        const total = selected.reduce((sum, index) => sum + values[index], 0);
        if (selected.length > 1 && total === 10) {
          selected.forEach(index => {
            values[index] = 0;
            const cell = boardElement.children[index];
            cell.textContent = '';
            cell.classList.add('empty');
            cell.setAttribute('aria-label', '빈 칸');
          });
          score += selected.length * 10;
          updateScore();
        }
        clearSelection();
      }

      function updateTimer() {
        const minutes = Math.floor(secondsLeft / 60);
        const seconds = String(secondsLeft % 60).padStart(2, '0');
        timeElement.textContent = `${minutes}:${seconds}`;
        timerFill.style.transform = `scaleX(${secondsLeft / gameLength})`;
      }

      function endGame() {
        gameOver = true;
        dragging = false;
        clearSelection();
        finalScore.textContent = String(score);
        overlay.hidden = false;
      }

      function startGame() {
        window.clearInterval(timerId);
        score = 0;
        secondsLeft = gameLength;
        dragging = false;
        gameOver = false;
        overlay.hidden = true;
        createBoard();
        updateScore();
        updateTimer();
        clearSelection();
        timerId = window.setInterval(() => {
          secondsLeft -= 1;
          updateTimer();
          if (secondsLeft <= 0) {
            window.clearInterval(timerId);
            endGame();
          }
        }, 1000);
      }

      boardElement.addEventListener('pointerdown', event => {
        const cell = event.target.closest('.cell');
        if (!cell || gameOver || Number(cell.textContent) === 0) return;
        event.preventDefault();
        dragging = true;
        selected = [];
        visitCell(Number(cell.dataset.index));
      });

      window.addEventListener('pointermove', event => {
        if (!dragging) return;
        const cell = document.elementFromPoint(event.clientX, event.clientY)?.closest('.cell');
        if (cell && boardElement.contains(cell)) visitCell(Number(cell.dataset.index));
      });

      window.addEventListener('pointerup', finishSelection);
      window.addEventListener('pointercancel', finishSelection);
      document.querySelector('#restart').addEventListener('click', startGame);
      document.querySelector('#play-again').addEventListener('click', startGame);
      bestElement.textContent = String(readBestScore());
      startGame();
    })();
  </script>
</body>
</html>
